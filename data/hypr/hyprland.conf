# Hyprland configuration for Flamenco Shell, written by `flamenco hyprland-config`.
# Your previous config was backed up next to this file (hyprland.conf.bak-*).
# Reference: https://wiki.hyprland.org/Configuring/
#
# Flamenco Settings writes the flamenco-*.conf files sourced at the bottom
# (displays, keyboard, cursor, shortcuts); edit everything else here.

# any screen not configured in Settings → Displays
monitor = , preferred, auto, 1

# Qt apps follow the Flamenco palette through qt6ct; Electron apps run natively on Wayland.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# The shell: bar, wallpaper, notifications, launcher, lock screen…
# Its log is at ~/.cache/flamenco/shell.log if it doesn't appear.
exec-once = flamenco run

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(ff5d73) rgb(ffb867) 45deg
    col.inactive_border = rgb(46343a)
    layout = dwindle
}

decoration {
    rounding = 12
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000070)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

animations {
    enabled = true
    bezier = emphasized, 0.05, 0.7, 0.1, 1
    animation = windows, 1, 5, emphasized, popin 85%
    animation = workspaces, 1, 5, emphasized, slide
    animation = fade, 1, 4, emphasized
    animation = layers, 1, 4, emphasized, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Flamenco windows float
windowrule = float, title:^(Flamenco Settings|Flamenco Setup)$
windowrule = float, title:^(Picture-in-Picture)$

$mod = SUPER
$terminal = @@TERMINAL@@

# ── apps ──
bind = $mod, T, exec, $terminal
bind = $mod, Return, exec, $terminal

# ── windows ──
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod CTRL, left, movewindow, l
bind = $mod CTRL, right, movewindow, r
bind = $mod CTRL, up, movewindow, u
bind = $mod CTRL, down, movewindow, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── workspaces ──
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# ── screenshots (grim + slurp) ──
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL, Print, exec, grim - | wl-copy

# ── media keys (the shell's OSD; plain tools if it isn't running) ──
bindel = , XF86AudioRaiseVolume, exec, flamenco volume up || wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, flamenco volume down || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, flamenco volume mute || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, flamenco volume mic-mute || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, flamenco brightness up || brightnessctl --class=backlight set +5%
bindel = , XF86MonBrightnessDown, exec, flamenco brightness down || brightnessctl --class=backlight set 5%-
bindl = , XF86AudioPlay, exec, flamenco media toggle || playerctl play-pause
bindl = , XF86AudioNext, exec, flamenco media next || playerctl next
bindl = , XF86AudioPrev, exec, flamenco media previous || playerctl previous

# ── session (works even if the shell isn't running) ──
bind = $mod SHIFT, E, exit

# ── managed by Flamenco Settings (keep these last so Flamenco's shortcuts win) ──
source = ~/.config/hypr/flamenco-monitors.conf
source = ~/.config/hypr/flamenco-input.conf
source = ~/.config/hypr/flamenco-cursor.conf
source = ~/.config/hypr/flamenco-binds.conf
source = ~/.config/hypr/flamenco-layout.conf
